#####################################################################
#   Fan Control
#####################################################################

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: EBB36:PA0
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
fan_speed: 1
tachometer_pin: ^EBB36:PB3
tachometer_ppr: 2
tachometer_poll_interval: 0.0009


[fan]
##  Print Cooling Fan - FAN0
pin: EBB36:PA1
cycle_time: 0.01
kick_start_time: 0.2
hardware_pwm: False
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

[fan_generic bed_fans]
pin: PB2
max_power: 1.0
cycle_time: 0.010
#cycle_time: 0.05
shutdown_speed: 1
kick_start_time: 0.5
off_below: 0.10

[fan_generic RSCS]
pin: PB3
max_power: 1
shutdown_speed: 0
kick_start_time: 0.5
cycle_time: 0.05
off_below: 0.15
hardware_pwm: False